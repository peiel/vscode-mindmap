<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    ${csp}
    <title>mindmap</title>
    <!-- bower:css -->
    <link rel="stylesheet" href="${vscode}/bower_components/bootstrap/dist/css/bootstrap.css" />
    <link rel="stylesheet" href="${vscode}/bower_components/hotbox/hotbox.css" />
    <link rel="stylesheet" href="${vscode}/node_modules/kityminder-core/dist/kityminder.core.css" />
    <link rel="stylesheet" href="${vscode}/bower_components/color-picker/dist/color-picker.min.css" />
    <!-- endbower -->
    <link rel="stylesheet" href="${vscode}/vendor/vditor-note/dist/index.css" />
    <link rel="stylesheet" href="${vscode}/dist/kityminder.editor.min.css" />

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
    </style>

    <script>
        window.vscode = acquireVsCodeApi();
        var lang = "${vscode_lang}";
        var upload_url = "${vscode_upload_url}";
        window.KM_VDITOR_CDN = "${vscode}/vendor/vditor-note";
        var obj = {
            lang,
            upload_url
        }
        window.vscode.setState(obj);
    </script>
</head>

<body ng-app="kityminderDemo" ng-controller="MainController">
    <kityminder-editor on-init="initEditor(editor, minder)"></kityminder-editor>
</body>

<!-- bower:js -->
<script src="${vscode}/bower_components/jquery/dist/jquery.js"></script>
<script src="${vscode}/bower_components/bootstrap/dist/js/bootstrap.js"></script>
<script src="${vscode}/bower_components/angular/angular.js"></script>
<script src="${vscode}/bower_components/angular-bootstrap/ui-bootstrap-tpls.js"></script>
<script src="${vscode}/bower_components/marked/lib/marked.js"></script>
<script src="${vscode}/bower_components/hotbox/hotbox.js"></script>
<script src="${vscode}/bower_components/kity/dist/kity.min.js"></script>
<script src="${vscode}/node_modules/kityminder-core/dist/kityminder.core.min.js"></script>
<script src="${vscode}/bower_components/color-picker/dist/color-picker.min.js"></script>
<script src="${vscode}/bower_components/js-base64/base64.min.js"></script>
<!-- endbower -->

<script src="${vscode}/vendor/vditor-note/dist/index.min.js"></script>
<script src="${vscode}/vendor/vditor-note/vditor-note-adapter.js"></script>
<script src="${vscode}/dist/kityminder.editor.min.js"></script>

<script src="${vscode}/main.js"></script>

</html>
